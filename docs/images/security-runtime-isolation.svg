<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Agent runtime isolation in Kubernetes</title>
  <desc id="desc">The mediator creates an Agent resource with a zero-permission identity, a restricted security context, one PVC subpath, and default-deny network policy. An optional loopback proxy in the secret-bearing executor image establishes TLS 1.3 mutual authentication to the model gateway.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.cluster{fill:#fff;stroke:#94a3b8;stroke-width:2}.pod{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.control{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.storage{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.allowed{fill:#ecfdf5;stroke:#059669;stroke-width:2}.blocked{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.secret{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.head{font:700 22px system-ui,sans-serif;fill:#0f172a}.label{font:700 16px system-ui,sans-serif;fill:#0f172a}.body{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:12px system-ui,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.allowline{stroke:#059669;stroke-width:2.3;fill:none;marker-end:url(#arrowGreen)}.denyline{stroke:#dc2626;stroke-width:2.3;stroke-dasharray:7 6;fill:none}.pill{fill:#ede9fe}.pilltext{font:600 13px system-ui,sans-serif;fill:#5b21b6}.secrettext{font:600 13px system-ui,sans-serif;fill:#c2410c}.limit{font:700 13px system-ui,sans-serif;fill:#b91c1c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#059669"/></marker>
  </defs>
  <rect class="bg" width="1440" height="860" rx="22"/>
  <text class="head" x="720" y="48" text-anchor="middle">Defense in depth around the Agent pod</text>

  <rect class="cluster" x="35" y="82" width="1370" height="720" rx="20"/>
  <text class="label" x="65" y="118">Shared user namespace — isolated by an immutable workspace-id label</text>

  <rect class="control" x="70" y="160" width="280" height="190" rx="14"/>
  <text class="label" x="210" y="192" text-anchor="middle">Mediator</text>
  <text class="body" x="210" y="224" text-anchor="middle">only component allowed to write</text>
  <text class="body" x="210" y="249" text-anchor="middle">Agent / Task / ConfigMap / Lease</text>
  <text class="body" x="210" y="285" text-anchor="middle">namespace-scoped RBAC</text>
  <text class="body" x="210" y="310" text-anchor="middle">no Secret read permission</text>

  <rect class="pod" x="465" y="145" width="510" height="475" rx="18"/>
  <text class="head" x="720" y="185" text-anchor="middle">Agent pod — user-controlled workload</text>
  <rect class="pill" x="505" y="215" width="200" height="34" rx="17"/><text class="pilltext" x="605" y="237" text-anchor="middle">runAsNonRoot + UID/GID</text>
  <rect class="pill" x="735" y="215" width="200" height="34" rx="17"/><text class="pilltext" x="835" y="237" text-anchor="middle">RuntimeDefault seccomp</text>
  <rect class="pill" x="505" y="265" width="200" height="34" rx="17"/><text class="pilltext" x="605" y="287" text-anchor="middle">capabilities: drop ALL</text>
  <rect class="pill" x="735" y="265" width="200" height="34" rx="17"/><text class="pilltext" x="835" y="287" text-anchor="middle">no privilege escalation</text>
  <rect class="pill" x="505" y="315" width="200" height="34" rx="17"/><text class="pilltext" x="605" y="337" text-anchor="middle">root filesystem read-only</text>
  <rect class="pill" x="735" y="315" width="200" height="34" rx="17"/><text class="pilltext" x="835" y="337" text-anchor="middle">CPU / RAM / ephemeral limits</text>
  <rect class="blocked" x="505" y="385" width="200" height="135" rx="12"/>
  <text class="label" x="605" y="417" text-anchor="middle">Kubernetes identity</text>
  <text class="body" x="605" y="450" text-anchor="middle">ServiceAccount default</text>
  <text class="body" x="605" y="475" text-anchor="middle">zero RBAC permissions</text>
  <text class="body" x="605" y="500" text-anchor="middle">token not mounted</text>
  <rect class="allowed" x="735" y="385" width="200" height="135" rx="12"/>
  <text class="label" x="835" y="417" text-anchor="middle">Allowed writes</text>
  <text class="body" x="835" y="450" text-anchor="middle">/workspace/project</text>
  <text class="body" x="835" y="475" text-anchor="middle">/tmp and /home/agent</text>
  <text class="body" x="835" y="500" text-anchor="middle">EmptyDirs limited to 1 Gi</text>
  <rect class="secret" x="505" y="540" width="430" height="55" rx="12"/>
  <text class="secrettext" x="720" y="563" text-anchor="middle">Optional mTLS proxy · HTTP loopback 127.0.0.1:9443</text>
  <text class="tiny" x="720" y="584" text-anchor="middle">credential bundle is recoverable from the secret-bearing executor image</text>

  <rect class="storage" x="1090" y="155" width="270" height="140" rx="14"/>
  <text class="label" x="1225" y="187" text-anchor="middle">User PVC</text>
  <text class="body" x="1225" y="219" text-anchor="middle">one administrator-selected claim</text>
  <text class="body" x="1225" y="244" text-anchor="middle">one validated subPath</text>
  <text class="body" x="1225" y="269" text-anchor="middle">no ".." component</text>
  <path class="allowline" d="M975 455 H1030 V225 H1090"/>

  <rect class="allowed" x="1090" y="330" width="270" height="155" rx="14"/>
  <text class="label" x="1225" y="362" text-anchor="middle">NetworkPolicy egress</text>
  <text class="body" x="1225" y="394" text-anchor="middle">DNS TCP/UDP 53</text>
  <text class="body" x="1225" y="419" text-anchor="middle">same workspace-id pods</text>
  <text class="body" x="1225" y="444" text-anchor="middle">model gateway namespace</text>
  <text class="body" x="1225" y="469" text-anchor="middle">namespace allow, not service identity</text>
  <path class="allowline" d="M975 370 H1090"/>

  <rect class="allowed" x="1090" y="520" width="270" height="135" rx="14"/>
  <text class="label" x="1225" y="552" text-anchor="middle">mTLS gateway boundary</text>
  <text class="body" x="1225" y="582" text-anchor="middle">TLS 1.3 · server CA + SAN</text>
  <text class="body" x="1225" y="607" text-anchor="middle">client certificate required</text>
  <text class="body" x="1225" y="632" text-anchor="middle">required model / quota policy</text>
  <path class="allowline" d="M935 568 H1030 V585 H1090"/>

  <rect class="blocked" x="70" y="420" width="280" height="220" rx="14"/>
  <text class="label" x="210" y="454" text-anchor="middle">Denied mounts and access</text>
  <text class="body" x="210" y="491" text-anchor="middle">snapshot PVC · another PVC</text>
  <text class="body" x="210" y="518" text-anchor="middle">hostPath · socket runtime</text>
  <text class="body" x="210" y="545" text-anchor="middle">kubeconfig · JupyterHub token</text>
  <text class="body" x="210" y="572" text-anchor="middle">general Secret set</text>
  <text class="body" x="210" y="612" text-anchor="middle">direct Internet egress denied</text>
  <path class="denyline" d="M350 520 H465"/>
  <path d="M407 503 l17 17 -17 17 -17 -17z" fill="#dc2626"/>

  <path class="line" d="M350 245 H465"/><text class="tiny" x="407" y="230" text-anchor="middle">validated Agent CR</text>
  <text class="tiny" x="720" y="688" text-anchor="middle">NetworkPolicy limits reachability; the TLS handshake authenticates the gateway and possession of the embedded client key.</text>
  <text class="limit" x="720" y="724" text-anchor="middle">The shared image certificate is not a JupyterHub user, workspace, pod or non-exportable workload identity.</text>
  <text class="tiny" x="720" y="776" text-anchor="middle">Implementation: internal/kube/kubernetes.go · internal/mtlsproxy/proxy.go · templates/rbac.yaml · templates/networkpolicy.yaml</text>
</svg>
