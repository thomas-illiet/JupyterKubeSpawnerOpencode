<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Jupyter KubeOpenCode architecture</title>
  <desc id="desc">Browser and code-server select platform Registry assets through a JupyterHub-authenticated mediator relay to an isolated KubeOpenCode Agent.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.zone{fill:#fff;stroke:#94a3b8;stroke-width:2}.trusted{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.user{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.agent{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.store{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.label{font:600 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.zoneLabel{font:700 16px system-ui,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.control{stroke:#0891b2}.interactive{stroke:#7c3aed}.dash{stroke-dasharray:8 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1200" height="660" rx="18"/>
  <rect class="zone" x="30" y="55" width="340" height="550" rx="16"/><text class="zoneLabel" x="50" y="85">USER NAMESPACE</text>
  <rect class="zone" x="410" y="55" width="350" height="550" rx="16"/><text class="zoneLabel" x="430" y="85">PLATFORM NAMESPACE</text>
  <rect class="zone" x="800" y="55" width="370" height="550" rx="16"/><text class="zoneLabel" x="820" y="85">EXECUTION + DATA</text>

  <rect class="user" x="65" y="120" width="270" height="90" rx="12"/><text class="label" x="200" y="153" text-anchor="middle">Browser / JupyterHub</text><text class="small" x="200" y="180" text-anchor="middle">OIDC identity and routing</text>
  <rect class="user" x="65" y="255" width="270" height="130" rx="12"/><text class="label" x="200" y="290" text-anchor="middle">code-server</text><text class="small" x="200" y="316" text-anchor="middle">Agent configuration extension</text><text class="small" x="200" y="340" text-anchor="middle">terminal: opencode → mediator</text><text class="small" x="200" y="364" text-anchor="middle">no Kubernetes token</text>
  <rect class="store" x="65" y="455" width="270" height="85" rx="12"/><text class="label" x="200" y="488" text-anchor="middle">Workspace PVC</text><text class="small" x="200" y="516" text-anchor="middle">one authorised subPath</text>

  <rect class="trusted" x="450" y="120" width="270" height="105" rx="12"/><text class="label" x="585" y="154" text-anchor="middle">Mediator API</text><text class="small" x="585" y="180" text-anchor="middle">auth + Registry selection</text><text class="small" x="585" y="204" text-anchor="middle">required skills + CR writes</text>
  <rect class="trusted" x="450" y="285" width="270" height="95" rx="12"/><text class="label" x="585" y="320" text-anchor="middle">KubeOpenCode</text><text class="small" x="585" y="346" text-anchor="middle">controller + server proxy</text>
  <rect class="trusted" x="450" y="455" width="270" height="85" rx="12"/><text class="label" x="585" y="488" text-anchor="middle">Model gateway</text><text class="small" x="585" y="516" text-anchor="middle">provider egress + credentials</text>

  <rect class="agent" x="845" y="170" width="280" height="150" rx="12"/><text class="label" x="985" y="205" text-anchor="middle">KubeOpenCode Agent pod</text><text class="small" x="985" y="233" text-anchor="middle">OpenCode server + tools</text><text class="small" x="985" y="257" text-anchor="middle">non-root · no capabilities</text><text class="small" x="985" y="281" text-anchor="middle">read-only root · no K8s token</text><text class="small" x="985" y="305" text-anchor="middle">bounded resources</text>
  <rect class="store" x="845" y="395" width="280" height="85" rx="12"/><text class="label" x="985" y="428" text-anchor="middle">Snapshot PVC</text><text class="small" x="985" y="456" text-anchor="middle">optional Task API only</text>

  <path class="line" d="M200 210v45"/><path class="line control" d="M335 290C390 290 392 172 450 172"/><text class="small" x="390" y="214" text-anchor="middle">Bearer</text>
  <path class="line interactive" d="M335 340C390 340 395 332 450 332"/><text class="small" x="390" y="326" text-anchor="middle">proxy</text>
  <path class="line control" d="M720 170C780 170 785 210 845 210"/><text class="small" x="782" y="177" text-anchor="middle">Agent CR</text>
  <path class="line interactive" d="M720 332C780 332 785 270 845 270"/><text class="small" x="782" y="315" text-anchor="middle">HTTP/SSE</text>
  <path class="line dash" d="M845 305C760 350 400 430 335 478"/><text class="small" x="585" y="416" text-anchor="middle">mount: /workspace/project</text>
  <path class="line" d="M845 300C790 350 775 470 720 490"/><text class="small" x="785" y="430" text-anchor="middle">model API</text>
  <path class="line dash" d="M720 205C790 245 795 410 845 430"/><text class="small" x="780" y="376" text-anchor="middle">Jobs only</text>
</svg>
