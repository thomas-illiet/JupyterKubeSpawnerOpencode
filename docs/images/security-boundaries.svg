<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Jupyter KubeOpenCode security boundaries</title>
  <desc id="desc">Untrusted user interfaces cross authenticated and authorized control-plane boundaries before reaching a sandboxed Agent and approved services.</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke-width:3}.u{stroke:#dc2626}.t{stroke:#0891b2}.s{stroke:#7c3aed}.h{font:700 19px system-ui,sans-serif;fill:#0f172a}.p{font:14px system-ui,sans-serif;fill:#334155}.line{stroke:#334155;stroke-width:2;marker-end:url(#a)}.deny{stroke:#dc2626;stroke-dasharray:7 6}.tag{font:700 13px system-ui,sans-serif;fill:#dc2626}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1200" height="500" rx="18"/>
  <rect class="box u" x="45" y="105" width="260" height="220" rx="15"/><text class="h" x="175" y="145" text-anchor="middle">Untrusted user zone</text><text class="p" x="175" y="182" text-anchor="middle">browser · extension · terminal</text><text class="p" x="175" y="210" text-anchor="middle">workspace · prompts · skills</text><text class="p" x="175" y="260" text-anchor="middle">No model secret</text><text class="p" x="175" y="286" text-anchor="middle">No CRD mutation</text>
  <rect class="box t" x="430" y="105" width="320" height="220" rx="15"/><text class="h" x="590" y="145" text-anchor="middle">Trusted control plane</text><text class="p" x="590" y="182" text-anchor="middle">JupyterHub identity validation</text><text class="p" x="590" y="210" text-anchor="middle">workspace + Registry allowlists</text><text class="p" x="590" y="238" text-anchor="middle">mandatory skill enforcement</text><text class="p" x="590" y="276" text-anchor="middle">namespace-scoped RBAC</text><text class="p" x="590" y="302" text-anchor="middle">default-deny NetworkPolicy</text>
  <rect class="box s" x="875" y="105" width="280" height="220" rx="15"/><text class="h" x="1015" y="145" text-anchor="middle">Sandboxed execution</text><text class="p" x="1015" y="182" text-anchor="middle">non-root · seccomp</text><text class="p" x="1015" y="210" text-anchor="middle">read-only root · bounded tmp</text><text class="p" x="1015" y="238" text-anchor="middle">one PVC subpath</text><text class="p" x="1015" y="276" text-anchor="middle">DNS + model gateway only</text><text class="p" x="1015" y="302" text-anchor="middle">zero-permission ServiceAccount</text>
  <line class="line" x1="305" y1="185" x2="430" y2="185"/><text class="p" x="368" y="170" text-anchor="middle">Bearer auth</text>
  <line class="line" x1="750" y1="185" x2="875" y2="185"/><text class="p" x="812" y="170" text-anchor="middle">validated CR</text>
  <line class="line deny" x1="305" y1="285" x2="875" y2="285"/><text class="tag" x="590" y="360" text-anchor="middle">DENIED: arbitrary PVC · Kubernetes API · Secrets · host mounts · unrestricted egress</text>
  <text class="p" x="600" y="430" text-anchor="middle">Administrative prerequisites: no user Kubernetes token · Pod Security restricted · encrypted Secrets · audited cluster</text>
</svg>
