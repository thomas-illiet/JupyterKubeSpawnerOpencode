<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">JupyterHub token validation and workspace authorization</title>
  <desc id="desc">The local proxy adds the JupyterHub token. The mediator explicitly asks the JupyterHub user API to validate that token. JupyterHub returns the canonical identity. The mediator then maps that identity through the administrator allowlist and removes credentials before relaying traffic to KubeOpenCode.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.untrusted{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.trusted{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.identity{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.platform{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.safe{fill:#ecfdf5;stroke:#059669;stroke-width:2}.head{font:700 25px system-ui,sans-serif;fill:#0f172a}.subhead{font:600 16px system-ui,sans-serif;fill:#475569}.label{font:700 17px system-ui,sans-serif;fill:#0f172a}.body{font:14px system-ui,sans-serif;fill:#475569}.small{font:13px system-ui,sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.validation{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}.response{stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrowBlue)}.deny{stroke:#dc2626;stroke-width:2.5;stroke-dasharray:8 6;fill:none}.badge{fill:#0f172a}.badgeText{font:700 13px system-ui,sans-serif;fill:#fff}.callout{font:700 14px system-ui,sans-serif;fill:#1d4ed8}.danger{font:700 14px system-ui,sans-serif;fill:#b91c1c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1600" height="820" rx="22"/>
  <text class="head" x="800" y="45" text-anchor="middle">From a JupyterHub token to an authorized Agent</text>
  <text class="subhead" x="800" y="72" text-anchor="middle">Identity validation and workspace authorization are separate controls</text>
  <rect class="lane" x="30" y="100" width="1540" height="650" rx="20"/>

  <rect class="untrusted" x="65" y="190" width="250" height="185" rx="14"/>
  <circle class="badge" cx="92" cy="217" r="15"/><text class="badgeText" x="92" y="222" text-anchor="middle">1</text>
  <text class="label" x="190" y="235" text-anchor="middle">Local loopback proxy</text>
  <text class="body" x="190" y="278" text-anchor="middle">listens on 127.0.0.1</text>
  <text class="body" x="190" y="305" text-anchor="middle">adds the JupyterHub Bearer</text>
  <text class="body" x="190" y="332" text-anchor="middle">removes it from OpenCode env</text>

  <rect class="trusted" x="375" y="190" width="250" height="185" rx="14"/>
  <circle class="badge" cx="402" cy="217" r="15"/><text class="badgeText" x="402" y="222" text-anchor="middle">2</text>
  <text class="label" x="500" y="235" text-anchor="middle">Mediator</text>
  <text class="body" x="500" y="278" text-anchor="middle">receives Authorization: Bearer</text>
  <text class="body" x="500" y="305" text-anchor="middle">does not trust any username</text>
  <text class="body" x="500" y="332" text-anchor="middle">provided by the client</text>

  <rect class="identity" x="685" y="150" width="250" height="265" rx="14"/>
  <circle class="badge" cx="712" cy="177" r="15"/><text class="badgeText" x="712" y="182" text-anchor="middle">3</text>
  <text class="label" x="810" y="198" text-anchor="middle">JupyterHub user API</text>
  <text class="callout" x="810" y="242" text-anchor="middle">TOKEN VALIDATION</text>
  <text class="body" x="810" y="278" text-anchor="middle">validates the received Bearer</text>
  <text class="body" x="810" y="305" text-anchor="middle">invalid token → HTTP 401</text>
  <rect class="safe" x="715" y="332" width="190" height="55" rx="10"/>
  <text class="body" x="810" y="354" text-anchor="middle">valid token</text>
  <text class="label" x="810" y="378" text-anchor="middle">→ canonical username</text>

  <rect class="trusted" x="995" y="190" width="250" height="185" rx="14"/>
  <circle class="badge" cx="1022" cy="217" r="15"/><text class="badgeText" x="1022" y="222" text-anchor="middle">4</text>
  <text class="label" x="1120" y="235" text-anchor="middle">Mediator authorization</text>
  <text class="body" x="1120" y="278" text-anchor="middle">username → admin allowlist</text>
  <text class="body" x="1120" y="305" text-anchor="middle">resolves namespace, PVC, subPath</text>
  <text class="body" x="1120" y="332" text-anchor="middle">not owned → neutral 404</text>

  <rect class="platform" x="1305" y="190" width="230" height="185" rx="14"/>
  <circle class="badge" cx="1332" cy="217" r="15"/><text class="badgeText" x="1332" y="222" text-anchor="middle">5</text>
  <text class="label" x="1420" y="235" text-anchor="middle">KubeOpenCode relay</text>
  <text class="body" x="1420" y="278" text-anchor="middle">server-derived target</text>
  <text class="body" x="1420" y="305" text-anchor="middle">authorized workspace Agent</text>
  <text class="body" x="1420" y="332" text-anchor="middle">HTTP · SSE · WebSocket</text>

  <path class="flow" d="M315 282 H375"/><text class="small" x="345" y="265" text-anchor="middle">Bearer</text>
  <path class="validation" d="M625 250 H685"/><text class="callout" x="655" y="225" text-anchor="middle">validate</text>
  <path class="response" d="M685 340 H625"/><text class="callout" x="655" y="365" text-anchor="middle">username</text>
  <path class="flow" d="M935 282 H995"/><text class="small" x="965" y="265" text-anchor="middle">identity</text>
  <path class="flow" d="M1245 282 H1305"/><text class="small" x="1275" y="265" text-anchor="middle">relay</text>

  <rect class="untrusted" x="375" y="475" width="870" height="120" rx="14"/>
  <text class="danger" x="810" y="505" text-anchor="middle">BEFORE RELAY: REMOVE USER CREDENTIALS</text>
  <text class="body" x="810" y="540" text-anchor="middle">Authorization removed · Cookie removed · X-Forwarded-User removed</text>
  <text class="body" x="810" y="568" text-anchor="middle">The Agent pod never receives the JupyterHub token or a client-declared identity.</text>
  <path class="deny" d="M500 620 H1120"/>
  <path d="M810 603 l17 17 -17 17 -17 -17z" fill="#dc2626"/>
  <text class="danger" x="810" y="665" text-anchor="middle">DENIED: direct client access → Kubernetes / Agent / another workspace</text>
  <text class="small" x="800" y="715" text-anchor="middle">Implementation: cmd/attach-proxy · internal/auth/jupyterhub.go · internal/api/service.go</text>
</svg>
