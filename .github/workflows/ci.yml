name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.7
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - run: npm --prefix vscode-extension ci
      - run: make verify
