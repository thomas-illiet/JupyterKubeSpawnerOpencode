apiVersion: v1
kind: Service
metadata:
  name: kubeopencode-mediator
  namespace: {{ .Values.mediator.namespace }}
  labels:
    {{- include "jko.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "jko.name" . }}-mediator
  ports:
    - { name: http, port: 8080, targetPort: http }

